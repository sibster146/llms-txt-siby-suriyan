name: Deploy Dev

on:
  push:
    branches:
      - dev
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  infrastructure:
    name: Create Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-dev-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Resolve state bucket
        id: state
        shell: bash
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          bucket="dev-llms-txt-${account_id}-terraform-state"
          crawler_repository="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/dev_llms_txt_web_crawler"
          generator_repository="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/dev_llms_txt_generator"
          refresh_repository="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/dev_llms_txt_nightly_refresh"
          echo "bucket=${bucket}" >> "${GITHUB_OUTPUT}"
          echo "TF_VAR_web_crawler_image_uri=${crawler_repository}:${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "TF_VAR_llms_txt_generator_image_uri=${generator_repository}:${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "TF_VAR_nightly_refresh_image_uri=${refresh_repository}:${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Prepare remote state
        env:
          STATE_BUCKET: ${{ steps.state.outputs.bucket }}
        run: bash infrastructure/scripts/ensure-state-bucket.sh

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure

      - name: Initialize Terraform
        run: |
          terraform -chdir=infrastructure/dev init \
            -reconfigure \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform -chdir=infrastructure/dev validate

      - name: Provision Lambda container registries
        run: |
          terraform -chdir=infrastructure/dev plan \
            -target=module.web_crawler_ecr \
            -target=module.llms_txt_generator_ecr \
            -target=module.nightly_refresh_ecr \
            -out=ecr.tfplan
          terraform -chdir=infrastructure/dev apply -auto-approve ecr.tfplan

      - name: Resolve web crawler image URI
        shell: bash
        run: |
          repository=$(terraform -chdir=infrastructure/dev output -raw web_crawler_ecr_repository_url)
          echo "WEB_CRAWLER_IMAGE_URI=${repository}:${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "TF_VAR_web_crawler_image_uri=${repository}:${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Resolve llms.txt generator image URI
        shell: bash
        run: |
          repository=$(terraform -chdir=infrastructure/dev output -raw llms_txt_generator_ecr_repository_url)
          echo "LLMS_TXT_GENERATOR_IMAGE_URI=${repository}:${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "TF_VAR_llms_txt_generator_image_uri=${repository}:${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Resolve nightly refresh image URI
        shell: bash
        run: |
          repository=$(terraform -chdir=infrastructure/dev output -raw nightly_refresh_ecr_repository_url)
          echo "NIGHTLY_REFRESH_IMAGE_URI=${repository}:${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "TF_VAR_nightly_refresh_image_uri=${repository}:${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build web crawler image
        run: |
          docker build \
            --platform linux/amd64 \
            --file deployables/dev/lambdas/web_crawler/Dockerfile \
            --tag "${WEB_CRAWLER_IMAGE_URI}" \
            .

      - name: Push web crawler image
        run: docker push "${WEB_CRAWLER_IMAGE_URI}"

      - name: Build llms.txt generator image
        run: |
          docker build \
            --platform linux/amd64 \
            --file deployables/dev/lambdas/llms_txt_generator/Dockerfile \
            --tag "${LLMS_TXT_GENERATOR_IMAGE_URI}" \
            .

      - name: Push llms.txt generator image
        run: docker push "${LLMS_TXT_GENERATOR_IMAGE_URI}"

      - name: Build nightly refresh image
        run: |
          docker build \
            --platform linux/amd64 \
            --file deployables/dev/lambdas/nightly_refresh/Dockerfile \
            --tag "${NIGHTLY_REFRESH_IMAGE_URI}" \
            .

      - name: Push nightly refresh image
        run: docker push "${NIGHTLY_REFRESH_IMAGE_URI}"

      - name: Plan development infrastructure
        run: terraform -chdir=infrastructure/dev plan -out=tfplan

      - name: Apply development infrastructure
        run: terraform -chdir=infrastructure/dev apply -auto-approve tfplan

      - name: Publish Cognito outputs
        run: |
          echo "## Development Cognito" >> "${GITHUB_STEP_SUMMARY}"
          echo "User pool: $(terraform -chdir=infrastructure/dev output -raw cognito_user_pool_id)" >> "${GITHUB_STEP_SUMMARY}"
          echo "Web client: $(terraform -chdir=infrastructure/dev output -raw cognito_web_client_id)" >> "${GITHUB_STEP_SUMMARY}"
          echo "## Web crawler" >> "${GITHUB_STEP_SUMMARY}"
          echo "Lambda: $(terraform -chdir=infrastructure/dev output -raw web_crawler_lambda_name)" >> "${GITHUB_STEP_SUMMARY}"
          echo "Image: ${WEB_CRAWLER_IMAGE_URI}" >> "${GITHUB_STEP_SUMMARY}"
          echo "## llms.txt generator" >> "${GITHUB_STEP_SUMMARY}"
          echo "Lambda: $(terraform -chdir=infrastructure/dev output -raw llms_txt_generator_lambda_name)" >> "${GITHUB_STEP_SUMMARY}"
          echo "Image: ${LLMS_TXT_GENERATOR_IMAGE_URI}" >> "${GITHUB_STEP_SUMMARY}"
          echo "## Nightly refresh" >> "${GITHUB_STEP_SUMMARY}"
          echo "Lambda: $(terraform -chdir=infrastructure/dev output -raw nightly_refresh_lambda_name)" >> "${GITHUB_STEP_SUMMARY}"
          echo "Schedule: $(terraform -chdir=infrastructure/dev output -raw nightly_refresh_schedule_name)" >> "${GITHUB_STEP_SUMMARY}"
          echo "Image: ${NIGHTLY_REFRESH_IMAGE_URI}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Export infrastructure outputs
        run: terraform -chdir=infrastructure/dev output -json > terraform-outputs-dev.json

      - name: Share infrastructure outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-dev
          path: terraform-outputs-dev.json
          retention-days: 1

  integration_tests:
    name: Run Integration Tests
    needs: infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TERRAFORM_OUTPUTS_FILE: .deployment/terraform-outputs-dev.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: integration-dev-${{ github.run_id }}

      - name: Download infrastructure outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs-dev
          path: .deployment

      - name: Set up Python for integration tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install integration test dependencies
        run: python -m pip install -e 'backend[dev]'

      - name: Test full guest crawl workflow
        timeout-minutes: 40
        env:
          GUEST_EMAIL: ${{ secrets.GUEST_EMAIL }}
          GUEST_PASSWORD: ${{ secrets.GUEST_PASSWORD }}
        run: bash infrastructure/scripts/run-integration-tests.sh dev

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results-dev
          path: backend/integration-results.xml
          if-no-files-found: ignore
