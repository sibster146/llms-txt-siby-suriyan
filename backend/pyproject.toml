[project]
name = "llms-txt-backend"
version = "0.1.0"
description = "FastAPI backend for the llms.txt generator"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.42,<2",
  "email-validator>=2.3,<3",
  "fastapi>=0.128,<1",
  "lxml>=6,<7",
  "markdown-it-py>=4,<5",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic-settings>=2.12,<3",
  "trafilatura>=2,<3",
  "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
